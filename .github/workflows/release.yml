name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and upload binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Build release binaries
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            name="elftree-${VERSION}-${GOOS}-${GOARCH}"
            [ "$GOOS" = "windows" ] && name="${name}.exe"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${name}" .
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "${VERSION}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" dist/* --clobber --repo "${REPO}"
          else
            gh release create "${VERSION}" dist/* --generate-notes --repo "${REPO}"
          fi
